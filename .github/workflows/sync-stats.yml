name: Sync Halo PC OG Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4

      - name: Download stats from NFO FTP
        run: |
          python3 << 'PY'
          from ftplib import FTP
          import os

          host = os.environ["NFO_FTP_HOST"]
          port = int(os.environ.get("NFO_FTP_PORT", "21"))
          user = os.environ["NFO_FTP_USER"]
          password = os.environ["NFO_FTP_PASS"]

          ftp = FTP()
          ftp.connect(host, port, timeout=30)
          ftp.login(user, password)

          with open("halopcog_stats.json", "wb") as f:
              ftp.retrbinary("RETR /halopcog_stats.json", f.write)

          ftp.quit()
          PY
        env:
          NFO_FTP_HOST: ${{ secrets.NFO_FTP_HOST }}
          NFO_FTP_PORT: ${{ secrets.NFO_FTP_PORT }}
          NFO_FTP_USER: ${{ secrets.NFO_FTP_USER }}
          NFO_FTP_PASS: ${{ secrets.NFO_FTP_PASS }}

      - name: Update Discord leaderboard message
        run: |
          python3 << 'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          webhook = os.environ["DISCORD_STATS_WEBHOOK"]

          with open("halopcog_stats.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          players = data.get("players", {})

          rows = []
          for name, stats in players.items():
              rows.append({
                  "name": name,
                  "kills": int(stats.get("kills", 0)),
                  "deaths": int(stats.get("deaths", 0)),
                  "playtime": int(stats.get("playtime", 0)),
                  "longest_spree": int(stats.get("longest_spree", 0)),
              })

          def fmt_time(seconds):
              hours = seconds // 3600
              minutes = (seconds % 3600) // 60
              if hours:
                  return f"{hours}h {minutes}m"
              return f"{minutes}m"

          def lines(rows, key, suffix):
              if not rows:
                  return "No stats yet."

              output = []
              for i, row in enumerate(rows[:5], 1):
                  value = row[key]
                  if key == "playtime":
                      value = fmt_time(value)
                      output.append(f"**{i}. {row['name']}** — {value}")
                  else:
                      output.append(f"**{i}. {row['name']}** — {value} {suffix}")
              return "\n".join(output)

          top_kills = sorted(rows, key=lambda r: (-r["kills"], r["name"].lower()))
          top_playtime = sorted(rows, key=lambda r: (-r["playtime"], r["name"].lower()))
          top_spree = sorted(rows, key=lambda r: (-r["longest_spree"], r["name"].lower()))

          embed = {
              "title": "Halo PC OG Leaderboards",
              "url": "https://halopc.net/stats/",
              "color": 3273959,
              "fields": [
                  {
                      "name": "Top Kills",
                      "value": lines(top_kills, "kills", "kills"),
                      "inline": False
                  },
                  {
                      "name": "Most Active",
                      "value": lines(top_playtime, "playtime", ""),
                      "inline": False
                  },
                  {
                      "name": "Best Sprees",
                      "value": lines(top_spree, "longest_spree", "spree"),
                      "inline": False
                  }
              ],
              "footer": {
                  "text": "Updates automatically from halopc.net/stats"
              }
          }

          payload = {
              "username": "Halo PC OG Stats",
              "content": "📊 **Halo PC OG stats are updated automatically.**\nFull leaderboards: https://halopc.net/stats/",
              "embeds": [embed]
          }

          id_file = "discord_stats_message_id.txt"
          message_id = ""

          if os.path.exists(id_file):
              with open(id_file, "r", encoding="utf-8") as f:
                  message_id = f.read().strip()

          def request(url, method, payload):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method=method
              )

              with urllib.request.urlopen(req) as response:
                  body = response.read().decode("utf-8")
                  return response.status, body

          if message_id:
              edit_url = webhook + "/messages/" + message_id

              try:
                  status, body = request(edit_url, "PATCH", payload)
                  print("Edited Discord message:", status)
              except urllib.error.HTTPError as e:
                  print("Edit failed, creating new message:", e.code)
                  message_id = ""

          if not message_id:
              create_url = webhook + "?wait=true"
              status, body = request(create_url, "POST", payload)
              print("Created Discord message:", status)

              response_json = json.loads(body)
              message_id = response_json["id"]

              with open(id_file, "w", encoding="utf-8") as f:
                  f.write(message_id)
          PY
        env:
          DISCORD_STATS_WEBHOOK: ${{ secrets.DISCORD_STATS_WEBHOOK }}

      - name: Commit updated stats
        run: |
          git config user.name "Halo PC OG Stats Bot"
          git config user.email "actions@github.com"

          git add halopcog_stats.json discord_stats_message_id.txt

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update Halo PC OG stats"
          git push
