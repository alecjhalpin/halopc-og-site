name: Sync Halo PC OG Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'   # Every 15 minutes (UTC)

permissions:
  contents: write

jobs:
  sync-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Better for git operations

      - name: Download stats from NFO FTP
        run: |
          python3 - << 'EOF'
          from ftplib import FTP
          import os
          import sys
          from datetime import datetime

          try:
              host = os.environ["NFO_FTP_HOST"]
              port = int(os.environ.get("NFO_FTP_PORT", "21"))
              user = os.environ["NFO_FTP_USER"]
              password = os.environ["NFO_FTP_PASS"]

              print(f"[{datetime.utcnow()}] Connecting to FTP server...")

              ftp = FTP(timeout=30)
              ftp.connect(host, port)
              ftp.login(user, password)
              
              print(f"[{datetime.utcnow()}] Logged in successfully. Downloading file...")

              with open("halopcog_stats.json", "wb") as f:
                  ftp.retrbinary("RETR /halopcog_stats.json", f.write)
              
              ftp.quit()
              print(f"[{datetime.utcnow()}] ✅ Successfully downloaded halopcog_stats.json")
              
          except Exception as e:
              print(f"[{datetime.utcnow()}] ❌ FTP Error: {e}")
              sys.exit(1)
          EOF
        env:
          NFO_FTP_HOST: ${{ secrets.NFO_FTP_HOST }}
          NFO_FTP_PORT: ${{ secrets.NFO_FTP_PORT }}
          NFO_FTP_USER: ${{ secrets.NFO_FTP_USER }}
          NFO_FTP_PASS: ${{ secrets.NFO_FTP_PASS }}

      - name: Commit and push updated stats
        run: |
          git config user.name "Halo PC OG Stats Bot"
          git config user.email "actions@github.com"
          
          git add halopcog_stats.json
          
          if git diff --cached --quiet; then
            echo "No changes detected in stats file."
            exit 0
          fi
          
          git commit -m "Update Halo PC OG stats (automated) - $(date '+%Y-%m-%d %H:%M:%S UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
